name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4 # Version v4 mise à jour
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # N'oubliez pas de remplacer "NOM_DE_VOTRE_DEPOT" par le vrai nom
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/portfolio/"

      - name: Deploy to GitHub Pages
        uses: BluefireTeam/flutter-gh-pages@v8
        with:
          targetBranch: gh-pages   # Changement ici (camelCase)
          workingDir: build/web    # Utilisation du paramètre correct workingDir au lieu de build_dir
